# Single shared interval for inverter telemetry and Pi host metrics.
# The Pi's sole storage is a plain SDHC card (no SSD) -- InfluxDB writes to
# its WAL on every flush, and consumer SD cards wear more from write
# frequency than from raw bytes written. 15 minutes matches the requested
# inverter cadence and keeps total writes to ~96/day instead of ~1,440/day.
[agent]
  interval = "15m"
  round_interval = true
  flush_interval = "15m"
  flush_jitter = "10s"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "$INFLUX_ORG"
  bucket = "$INFLUX_BUCKET"

# --- Inverter telemetry (SolarEdge HD-Wave via hd_wave_query.py) ---
[[inputs.exec]]
  commands = ["python3 /scripts/hd_wave_telegraf.py"]
  timeout = "10s"
  data_format = "json"
  json_string_fields = ["status_text"]
  name_override = "inverter"
  [inputs.exec.tags]
    inverter = "hd_wave"

# --- Raspberry Pi host metrics ---
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.temp]]

# --- UPS status & battery charge, via upsd running natively on the Pi host ---
[[inputs.upsd]]
  server = "host.docker.internal"
  port = 3493
  username = "telegraf"
  password = "$NUT_TELEGRAF_PASSWORD"
  # NUT/SNMP sometimes reports a whole-number reading (e.g. "120") without a
  # decimal point, which would otherwise get written as an integer on some
  # polls and a float on others -- InfluxDB locks a field's type on first
  # write and rejects the mismatched type forever after. Forcing float
  # avoids that entirely.
  force_float = true

# --- Weather, from the weather service (weather/weather_service.py) ---
# The service polls NWS and Open-Meteo itself and keeps the latest values in
# memory; these just snapshot them on the same 15-minute grid as the inverter.
# It returns HTTP 503 when it has nothing fresh, so no stale point is written.
# Every numeric field is sent as a float (see the force_float note above).
[[inputs.http]]
  urls = ["http://weather:8080/api/obs.json"]
  timeout = "10s"
  data_format = "json"
  tag_keys = ["station", "source", "sky_station"]
  json_string_fields = ["conditions"]
  name_override = "weather_obs"

[[inputs.http]]
  urls = ["http://weather:8080/api/model.json"]
  timeout = "10s"
  data_format = "json"
  name_override = "weather_model"
