# Single shared interval for inverter telemetry and Pi host metrics.
# The Pi's sole storage is a plain SDHC card (no SSD) -- InfluxDB writes to
# its WAL on every flush, and consumer SD cards wear more from write
# frequency than from raw bytes written. 15 minutes matches the requested
# inverter cadence and keeps total writes to ~96/day instead of ~1,440/day.
[agent]
  interval = "15m"
  round_interval = true
  flush_interval = "15m"
  flush_jitter = "10s"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "$INFLUX_ORG"
  bucket = "$INFLUX_BUCKET"

# --- Inverter telemetry (SolarEdge HD-Wave via hd_wave_query.py) ---
[[inputs.exec]]
  commands = ["python3 /scripts/hd_wave_telegraf.py"]
  timeout = "10s"
  data_format = "json"
  json_string_fields = ["status_text"]
  name_override = "inverter"
  [inputs.exec.tags]
    inverter = "hd_wave"

# --- Raspberry Pi host metrics ---
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.temp]]
