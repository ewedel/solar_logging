services:
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

  telegraf:
    build:
      context: .
      dockerfile: telegraf/Dockerfile
    restart: unless-stopped
    depends_on:
      - influxdb
      - weather
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INVERTER_HOST: ${INVERTER_HOST}
      INVERTER_PORT: ${INVERTER_PORT}
      NUT_TELEGRAF_PASSWORD: ${NUT_TELEGRAF_PASSWORD}
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
    extra_hosts:
      # Lets the container reach upsd, which runs natively on the Pi host
      # (see README "Handling power loss" for the NUT setup).
      - "host.docker.internal:host-gateway"

  weather:
    # NWS + Open-Meteo collector and the tablet display page (port 8080).
    # Keeps data in memory only; Telegraf polls it and writes to InfluxDB.
    build: weather
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      WEATHER_LAT: ${WEATHER_LAT}
      WEATHER_LON: ${WEATHER_LON}
      WEATHER_STATION: ${WEATHER_STATION}
      WEATHER_FALLBACK_STATIONS: ${WEATHER_FALLBACK_STATIONS:-}
      SKY_STATION: ${SKY_STATION:-}
      WEATHER_FALLBACK_AUTO: ${WEATHER_FALLBACK_AUTO:-true}
      NWS_USER_AGENT: ${NWS_USER_AGENT}
      PANEL_TILT: ${PANEL_TILT:-20}
      PANEL_AZIMUTH: ${PANEL_AZIMUTH:-0}

  grafana:
    image: grafana/grafana-oss:11.3.0
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      # Read-only dashboard viewing with no login. Admin login is still
      # required for any change (editing, settings, data sources).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
